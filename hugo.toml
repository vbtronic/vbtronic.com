baseURL = 'https://www.vbtronic.com/'
languageCode = 'en-us'
title = 'Viktor Brunclík'
enableRobotsTXT = true
enableEmoji = false
disableKinds = ['RSS']
taxonomies = {}

[params]
  description = "I build websites, business cards and the marketing around them, through Bruncsoft — a small student studio I founded and run."
  author = "Viktor Brunclík"

[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['html', 'llms']

[markup]
  [markup.highlight]
    style = 'monokai'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

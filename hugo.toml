baseURL = 'https://vbtronic.com/'
title = 'Viktor Brunclík'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = false
disableKinds = ['RSS']
taxonomies = {}

[params]
  author = "Viktor Brunclík"

# English is the default and lives at /. Czech lives at /cs/.
[languages]
  [languages.en]
    languageCode = 'en-us'
    languageName = 'English'
    weight = 1
    [languages.en.params]
      description = "I build websites, business cards and the marketing around them, through Bruncsoft — a small student studio I founded and run."
  [languages.cs]
    languageCode = 'cs-CZ'
    languageName = 'Čeština'
    weight = 2
    [languages.cs.params]
      description = "Dělám weby, vizitky a marketing kolem nich přes Bruncsoft — malé studentské studio, které jsem založil a vedu."

[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['html', 'llms']

[markup]
  [markup.highlight]
    style = 'monokai'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

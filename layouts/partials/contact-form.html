{{- $id := .id | default "contact-form" -}}
{{- $title := .title | default "Contact" -}}
{{- $description := .description | default "Get in touch via email." -}}
{{- $source := .source | default "unknown" -}}

<section class="about-card contact-form-card" id="{{ $id }}">
  <h2 class="about-heading">{{ $title }}</h2>
  <div class="about-body">
    <p>{{ $description }}</p>
  </div>
  <div class="contact-form-fields">
    <div class="contact-field">
      <label for="{{ $id }}-name">Your name</label>
      <input type="text" id="{{ $id }}-name" placeholder="Name">
    </div>
    <div class="contact-field">
      <label for="{{ $id }}-message">Message</label>
      <textarea id="{{ $id }}-message" placeholder="Your message..."></textarea>
    </div>
    <button type="button" class="contact-submit-btn" data-form-id="{{ $id }}">Open Email App</button>
  </div>
</section>

<script>
(function() {
  var btn = document.querySelector('[data-form-id="{{ $id }}"]');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var name = (document.getElementById('{{ $id }}-name').value || '').trim();
    var msg = (document.getElementById('{{ $id }}-message').value || '').trim();
    var subject = name ? 'Message from ' + name : 'Message from vbtronic.com';
    var body = msg;
    if (name) body = 'Name: ' + name + '\n\n' + msg;
    window.location.href = 'mailto:vb@vbtronic.com'
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body);
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <script>
  // Apply the theme before first paint to prevent a flash. Green on white is the
  // default; a saved choice or an explicit dark system preference wins.
  (function() {
    var saved = null;
    try { saved = localStorage.getItem('vbTheme'); } catch(e) {}
    if (!saved) {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
  </script>
  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- One page, like jaroslavbeck.com: no menu. The header is only the way back home
       from Privacy and For AI, plus the theme switch. -->
  <header class="site-header">
    <a href="/" class="site-logo">vbtronic<span class="accent">.com</span></a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="theme-icon theme-icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="theme-icon theme-icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main class="page">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ now.Year }} Viktor Brunclík · <a href="/privacy/">Privacy</a> · <a href="/ai/">For AI</a></p>
    <p>Built by Viktor Brunclík with the help of AI tools Amp and Claude Code.</p>
  </footer>

  <script>
  (function() {
    var toggle = document.getElementById('theme-toggle');

    function setTheme(theme, save) {
      document.documentElement.setAttribute('data-theme', theme);
      if (save) { try { localStorage.setItem('vbTheme', theme); } catch(e) {} }
    }

    toggle.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark', true);
    });

    // Mirrors the pre-paint script: follow the system only until the visitor picks.
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        var saved = null;
        try { saved = localStorage.getItem('vbTheme'); } catch(err) {}
        if (!saved) setTheme(e.matches ? 'dark' : 'light', false);
      });
    }
  })();
  </script>
</body>
</html>
